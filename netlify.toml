# Netlify serves the app straight from the alto folder. There is no build step.
[build]
  publish = "alto"
  command = ""

# Show the app at the site's root address.
[[redirects]]
  from = "/"
  to = "/alto.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    # The app only needs the microphone, and only for itself.
    Permissions-Policy = "microphone=(self), camera=(), geolocation=()"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"

# Always check for a new service worker, so updates reach installed apps.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
